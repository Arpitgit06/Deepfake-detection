[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "truthlens-backend"
version = "1.0.0"
description = "TruthLens AI Backend - Deepfake & Scam Detection API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "TruthLens Team", email = "team@truthlens.ai"}
]
keywords = ["deepfake", "scam-detection", "computer-vision", "nlp", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "python-multipart==0.0.6",
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.0",
    "opencv-python-headless==4.10.0.84",
    "numpy==1.26.3",
    "torch==2.2.0",
    "torchvision==0.17.0",
    "Pillow==10.1.0",
    "mediapipe==0.10.14",
    "scipy==1.12.0",
    "soundfile>=0.12.1",
    "fastdtw==0.3.4",
    "transformers==4.37.0",
    "langdetect==1.0.9",
    "regex==2023.12.25",
    "requests==2.31.0",
    "aiohttp==3.9.1",
    "redis==5.0.1",
    "psutil>=5.9.0",
    "tqdm==4.66.1",
    "loguru==0.7.2",
    "python-json-logger==2.0.7",
    "prometheus-client==0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "httpx==0.26.0",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "black==23.12.1",
    "isort==5.13.2",
    "mypy==1.7.1",
    "ruff==0.1.6",
    "pre-commit==3.6.0",
    "types-requests==2.31.0",
    "types-PyYAML==6.0.12",
    "ipython==8.18.1",
    "ipdb==0.13.13",
    "rich==13.7.0",
    "typer==0.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
strict = false

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
]
[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "S106"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]